# Claude Code bot. Mention @claude in an issue, an issue comment, a PR comment or a PR
# review. Only the repository owner can start it: anyone else's mention never starts
# the job, so the secrets below are never loaded for them.
#
# Secrets: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`). Optional, for web
# search: EXA_API_KEY, BRAVE_API_KEY, TAVILY_API_KEY; a server whose key is not set
# is left out.
#
# Plugins and MCP servers are pinned to the exact versions reviewed and scanned for
# 0rkhann/chemlit (commit a3a1c6e); changing any pin needs a new review.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      github.actor == github.repository_owner && (
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # thermochange, copasi_helper and COPASI are not available here, so the bot can
      # only compile and lint the code (see CLAUDE.md).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dev tools
        run: pip install ruff==0.16.10

      # Reviewed plugin versions, cloned at exact commits into a local marketplace,
      # so nothing updates on its own.
      - name: Fetch pinned plugins
        run: |
          set -euo pipefail
          market="$RUNNER_TEMP/claude-plugins"
          mkdir -p "$market/.claude-plugin"
          fetch() {  # name repo commit
            git init -q "$market/$1"
            git -C "$market/$1" fetch -q --depth 1 "https://github.com/$2.git" "$3"
            git -C "$market/$1" checkout -q FETCH_HEAD
            test "$(git -C "$market/$1" rev-parse HEAD)" = "$3"
          }
          fetch superpowers obra/superpowers 5bf4e78011075bcfc0dc295f0724994cd123ee71 # 6.4.1
          fetch ponytail DietrichGebert/ponytail 16f29800fd2681bdf24f3eb4ccffe38be3baec6b # 4.8.4
          jq -n '{name: "microkatc-pinned", owner: {name: "0rkhann"}, plugins: [
            {name: "superpowers", source: "./superpowers"},
            {name: "ponytail", source: "./ponytail"}]}' > "$market/.claude-plugin/marketplace.json"

      # Library docs and web search for the bot. Written at run time from secrets into
      # an owner-only file in the runner's temp folder, never into the repository, and
      # deleted when the job ends.
      - name: Write MCP server config
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          umask 077
          jq -n '{mcpServers: ({
            "context7": {type: "http", url: "https://mcp.context7.com/mcp"}
          }
          + (if env.EXA_API_KEY != "" then {"exa": {type: "http", url: "https://mcp.exa.ai/mcp", headers: {"x-api-key": env.EXA_API_KEY}}} else {} end)
          + (if env.BRAVE_API_KEY != "" then {"brave-search": {command: "npx", args: ["-y", "@brave/brave-search-mcp-server@2.1.4"], env: {BRAVE_API_KEY: env.BRAVE_API_KEY}}} else {} end)
          + (if env.TAVILY_API_KEY != "" then {"tavily": {command: "npx", args: ["-y", "tavily-mcp@0.2.22"], env: {TAVILY_API_KEY: env.TAVILY_API_KEY}}} else {} end)
          )}' > "$RUNNER_TEMP/claude-mcp.json"
          echo "MCP servers: $(jq -r '.mcpServers | keys | join(", ")' "$RUNNER_TEMP/claude-mcp.json")"

      - uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029 # v1.0.239
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude sees only the owner's comments: text from anyone else in a thread
          # cannot steer it (prompt injection).
          include_comments_by_actor: ${{ github.repository_owner }}
          # Keep tool output (which could contain secrets) out of the public run page.
          display_report: "false"
          show_full_output: "false"
          plugin_marketplaces: ${{ runner.temp }}/claude-plugins
          plugins: |
            superpowers@microkatc-pinned
            ponytail@microkatc-pinned
          # Commits, pushes and comments go through the action's own tools. Bash is
          # limited to the project's checks and read-only git: no `gh`, no `pip`, and
          # no `git -c ...`, which could run arbitrary shell.
          claude_args: >-
            --max-turns 80
            --mcp-config ${{ runner.temp }}/claude-mcp.json
            --allowedTools "Bash(python -m py_compile:*),Bash(python3 -m py_compile:*),Bash(ruff check:*),Bash(ruff format:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git mv:*),mcp__context7,mcp__exa,mcp__brave-search,mcp__tavily"

      - name: Remove MCP config
        if: always()
        run: rm -f "$RUNNER_TEMP/claude-mcp.json"
