# Nightly end-to-end run: the full main.py pipeline, the README figures, and a check of the
# results against the published values (tests/check_reproduction.py). Also runnable by hand
# from the Actions tab. Figures and result tables are kept as a run artifact for 14 days.
name: Nightly reproduction

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  # Also when a pull request changes this workflow or the check, so edits are tested before merging
  pull_request:
    paths:
      - .github/workflows/nightly.yml
      - tests/check_reproduction.py

permissions:
  contents: read

concurrency:
  group: nightly-reproduction
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Fetch thermochange at a pinned commit
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/thermochange"
          git -C "$RUNNER_TEMP/thermochange" fetch -q --depth 1 https://gitlab.com/dgarayr/thermochange.git daed0427e5ce04aad3e19170286aed85a35326ee
          git -C "$RUNNER_TEMP/thermochange" checkout -q FETCH_HEAD
          echo "thermochange=$RUNNER_TEMP/thermochange" >> "$GITHUB_ENV"

      - name: Run the full pipeline
        env:
          MPLBACKEND: Agg
        run: python main.py

      - name: Build the README figures
        env:
          MPLBACKEND: Agg
        run: python readme_figures.py

      - name: Check results against the paper
        run: |
          set -o pipefail
          python tests/check_reproduction.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep figures and result tables
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproduction-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            pics/*.png
            microkinetics_simulations_images/
            microkinetics_simulations/df_*.csv
            G_values_of_reactions/
